<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Bot — Script to Footage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0d0f12] text-zinc-100 antialiased">
  <main class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
    <header class="mb-8">
      <div class="mb-3 flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-lg bg-red-600 font-bold">YT</span><span class="text-sm font-medium uppercase tracking-[0.2em] text-zinc-500">Creator toolkit</span></div>
      <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">Script to stock footage</h1>
      <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-400">Turn your script into a visual shot list, preview matching Pexels footage, then download the assets when everything looks right.</p>
    </header>
    <section class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 shadow-2xl shadow-black/20 sm:p-6">
      <label for="script" class="mb-2 block text-sm font-medium text-zinc-200">Your script</label>
      <textarea id="script" class="min-h-[280px] w-full resize-y rounded-xl border border-zinc-700 bg-zinc-950 p-4 text-sm leading-6 text-zinc-100 outline-none transition placeholder:text-zinc-600 focus:border-red-500 focus:ring-2 focus:ring-red-500/20" placeholder="Paste your full script here..."></textarea>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center">
        <button id="generateBtn" class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl bg-red-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 focus:ring-offset-zinc-900 disabled:cursor-not-allowed disabled:bg-zinc-700 disabled:text-zinc-400">Generate preview</button>
        <button id="downloadBtn" class="hidden min-h-11 flex-1 items-center justify-center rounded-xl border border-red-500/50 bg-red-500/10 px-5 py-3 text-sm font-semibold text-red-300 transition hover:bg-red-500/20 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 focus:ring-offset-zinc-900 disabled:cursor-wait disabled:opacity-60">Download all</button>
      </div>
      <div id="loading" class="mt-5 hidden items-center gap-3 text-sm text-zinc-400" aria-live="polite"><span class="h-5 w-5 animate-spin rounded-full border-2 border-zinc-700 border-t-red-500"></span><span id="statusText">Reading your script...</span></div>
      <div id="status" class="mt-3 min-h-5 text-sm text-zinc-400" aria-live="polite"></div>
    </section>
    <section id="previewSection" class="mt-8 hidden">
      <div class="mb-4 flex items-end justify-between gap-4"><div><h2 class="text-xl font-semibold">Preview your shots</h2><p class="mt-1 text-sm text-zinc-500">Showing up to three matches per visual beat.</p></div><span id="shotCount" class="rounded-full border border-zinc-800 px-3 py-1 text-xs text-zinc-400"></span></div>
      <div id="previewGrid" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>
<script>
  const btn = document.getElementById('generateBtn'), downloadBtn = document.getElementById('downloadBtn'), scriptEl = document.getElementById('script');
  const status = document.getElementById('status'), loading = document.getElementById('loading'), statusText = document.getElementById('statusText');
  const section = document.getElementById('previewSection'), grid = document.getElementById('previewGrid'), count = document.getElementById('shotCount');
  let previewShots = [], timer;
  const messages = ['Reading your script...', 'Identifying key visual beats...', 'Searching for matching footage...', 'Almost there...'];
  function setError(message) { status.textContent = message; status.className = 'mt-3 min-h-5 text-sm text-red-400'; }
  function setStatus(message) { status.textContent = message; status.className = 'mt-3 min-h-5 text-sm text-zinc-400'; }
  function render(shots) {
    grid.innerHTML = ''; count.textContent = `${shots.length} shots`; section.classList.remove('hidden'); downloadBtn.classList.remove('hidden'); downloadBtn.classList.add('inline-flex');
    shots.forEach((shot, i) => {
      const card = document.createElement('article'); card.className = 'overflow-hidden rounded-xl border border-zinc-800 bg-zinc-900';
      const media = document.createElement('div'); media.className = 'grid aspect-video gap-1 bg-zinc-950 ' + (shot.results?.length > 1 ? 'grid-cols-3' : 'grid-cols-1');
      if (shot.needsAI) media.innerHTML = '<div class="col-span-full grid place-items-center p-6 text-center text-sm text-zinc-500"><span><span class="block text-2xl text-red-400">✦</span><span class="mt-2 block">Needs AI generation</span></span></div>';
      else shot.results.forEach((item) => { const img = document.createElement('img'); img.src = item.previewUrl; img.alt = shot.description; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.className = 'h-full min-w-0 w-full object-cover'; media.appendChild(img); });
      const body = document.createElement('div'); body.className = 'p-4'; body.innerHTML = `<p class="mb-1 text-xs font-medium uppercase tracking-wider text-red-400">Shot ${String(i+1).padStart(2,'0')}</p><h3 class="text-sm font-medium leading-5 text-zinc-200"></h3>`; body.querySelector('h3').textContent = shot.description;
      card.append(media, body); grid.appendChild(card);
    });
  }
  btn.addEventListener('click', async () => {
    const script = scriptEl.value.trim(); if (script.length < 20) return setError('Paste a full script first.');
    btn.disabled = true; downloadBtn.classList.add('hidden'); downloadBtn.classList.remove('inline-flex'); section.classList.add('hidden'); setStatus(''); loading.classList.remove('hidden'); loading.classList.add('flex'); let n = 0; statusText.textContent = messages[0]; timer = setInterval(() => statusText.textContent = messages[++n % messages.length], 3000);
    try { const res = await fetch('/api/preview', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({script}) }); const data = await res.json().catch(()=>({})); if (!res.ok) throw new Error(data.error || 'Something went wrong.'); previewShots = data.shots || []; render(previewShots); setStatus('Preview ready. Review the matches, then download when ready.'); }
    catch (e) { setError('Error: ' + e.message); } finally { clearInterval(timer); loading.classList.add('hidden'); loading.classList.remove('flex'); btn.disabled = false; }
  });
  downloadBtn.addEventListener('click', async () => {
    if (!previewShots.length) return; downloadBtn.disabled = true; downloadBtn.textContent = 'Preparing ZIP...'; setStatus('Downloading your footage...');
    try { const res = await fetch('/api/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({shots:previewShots})}); if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || 'Download failed.'); const url = URL.createObjectURL(await res.blob()), a = document.createElement('a'); a.href=url; a.download='stock-footage.zip'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); setStatus('Done — your download should start automatically.'); }
    catch(e) { setError('Error: '+e.message); } finally { downloadBtn.disabled=false; downloadBtn.textContent='Download all'; }
  });
</script>
</body>
</html>
